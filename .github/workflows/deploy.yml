name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR 푸시
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # GHCR 이미지 이름은 소문자만 허용 (ghcr.io/<owner>/<repo>)
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # EC2가 Graviton(t4g 등)이면 linux/arm64 로 바꾸세요
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on EC2
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # EC2에서 GHCR pull
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose & nginx files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/nginx/default.conf.template"
          target: "~/app"
          strip_components: 1

      - name: Pull & restart containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/app
            export APP_IMAGE
            # GITHUB_TOKEN은 이 job 동안만 유효하므로 매 배포마다 로그인 후 바로 로그아웃
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app
            docker logout ghcr.io
            docker compose up -d
            docker image prune -f
            # 헬스체크 (최대 약 2분 대기)
            for i in $(seq 1 24); do
              if docker exec app wget -qO- http://localhost:8080/api/v1/health >/dev/null 2>&1; then
                echo "Deploy OK"; exit 0
              fi
              sleep 5
            done
            echo "Health check failed"; docker compose logs --tail=100 app; exit 1
